[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "poba"
version = "0.1.0"
description = "Deep Reinforcement Learning for Competitive Pokémon Showdown (Gen 9 Random Battles) via poke-env and MaskablePPO"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "poke-env>=0.17.0",
    "stable-baselines3>=2.4.0",
    "sb3-contrib>=2.4.0",
    "gymnasium>=0.29.1",
    "torch>=2.2.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "matplotlib>=3.8.0",
    "tensorboard>=2.16.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
